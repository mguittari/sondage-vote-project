openapi: 3.1.0
info:
  title: Service d'authentification
  version: 0.1.0
  description: Inscription. Connexion, jetons et refresh tokens à ajouter.
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:3001
    description: Environnement de développement (docker compose)
tags:
  - name: auth
    description: Comptes et sessions
paths:
  /auth/inscription:
    post:
      tags: [auth]
      operationId: inscrire
      summary: Créer un compte
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Identifiants" }
      responses:
        "201":
          description: Compte créé
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Utilisateur" }
        "400": { $ref: "#/components/responses/Probleme" }
        "409": { $ref: "#/components/responses/Probleme" }
        "422": { $ref: "#/components/responses/Probleme" }
components:
  responses:
    Probleme:
      description: Erreur au format Problem Details (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Probleme" }
  schemas:
    Identifiants:
      type: object
      required: [email, motDePasse]
      properties:
        email: { type: string, format: email }
        motDePasse: { type: string, minLength: 12, maxLength: 128 }
    Utilisateur:
      type: object
      required: [id, email, role]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { type: string }
    Probleme:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
